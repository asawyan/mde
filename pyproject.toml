[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asawyan-mde"
version = "0.1.0"
description = "通过字符级与结构级特征识别最小可检测效应的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "asawyan" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://asawyan.github.io"
Repository = "https://github.com/asawyan/mde"
Issues = "https://github.com/asawyan/mde/issues"

[project.scripts]
mde = "mde:main"

[tool.setuptools]
py-modules = ["mde"]
